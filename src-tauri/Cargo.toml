[package]
name = "legere"
version = "0.0.1"
description = "Legere — 个人 PDF 文献库阅读器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "legere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "legere"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[features]
default = []
