[package]
name = "legere"
version = "0.1.0"
description = "Legere — 个人 PDF 文献库阅读器"
edition = "2021"
rust-version = "1.77"

[lib]
name = "legere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "legere"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
notify = "8.2.0"
jieba-rs = "0.11.0"
lopdf = "0.36.0"

[features]
# 生产构建必须启用：否则 tauri 会去加载 build.devUrl，release 里就是「localhost 拒绝连接」。
# tauri build 会自动带上；直接 cargo build --release 时必须显式 --features custom-protocol。
custom-protocol = ["tauri/custom-protocol"]
default = []
